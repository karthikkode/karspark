[project]
name = "karspark-client"
version = "0.1.0"
description = "Python client for karspark (the DGX Spark AI service): text, images, layers, video, upscaling, job control"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["karspark_client"]
