# Which models may be loaded at the same time (llama-swap matrix router).
# A model in no set can only run alone, which is the safe default for anything large.
# Memory budget: 121 GiB unified. Keep each set's total under ~105 GiB (the OS and desktop need the rest).
routing:
  router:
    use: matrix
    settings:
      matrix:
        # Set expressions can't contain ':', so every recipe id gets a short var here.
        vars:
          q06: "qwen3-0.6b:vllm"
        evict_costs: {}
        sets:
          # Small utility models only, for now. Add sets as real models arrive.
          solo-small: "q06"
