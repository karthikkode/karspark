[project]
name = "karspark-core"
version = "0.1.0"
description = "karspark: the single API in front of every model on the DGX Spark (keys, modes, scheduler, jobs, logging, MCP)"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["karspark"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
