# Smoke-test / utility model: proves the gateway end to end in under a minute.
models:
  "qwen3-0.6b:vllm":
    name: "Qwen3 0.6B (vLLM)"
    description: "tiny utility + gateway smoke test"
    aliases: ["qwen3-0.6b"]
    useModelName: "qwen3-0.6b"
    ttl: 600
    cmd: |
      ${ks-docker} ks-qwen3-0.6b-vllm
      --gpus all --ipc=host --memory 24g
      -p 127.0.0.1:${PORT}:8000
      -v ${models}/llm/qwen3-0.6b:/model:ro
      vllm/vllm-openai@sha256:6ff5ff0ddf3658d2c2d677dac5ca2d4726ce0156b4371166d918181b210bd4bc
      /model --served-model-name qwen3-0.6b
      --gpu-memory-utilization 0.08 --max-model-len 8192 --max-num-seqs 8
      --enable-auto-tool-choice --tool-call-parser hermes --reasoning-parser qwen3
    cmdStop: docker stop -t 20 ks-qwen3-0.6b-vllm
