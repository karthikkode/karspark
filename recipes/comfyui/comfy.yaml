# One ComfyUI container serves every image/video/upscale model (they share one process and its model cache),
# and speech (IndexTTS-2.5, a worker process of the adapter in its own venv; stopped on /v1/free like a family swap).
# The adapter in front of it is the internal job API for karspark-core (engines/comfyui/adapter/server.py).
# Jobs live in ${data}/jobs, shared with core: inputs, outputs and pause checkpoints.
kind: media
capabilities: [image, layers, video, upscale_image, upscale_video, speech, remove_background, depth, inpaint]
models: [flux2-dev, flux3-klein, qwen-image-layered, ltx-2.5, seedvr2-7b, seedvr2-7b-sharp, seedvr2-3b, flux2-refine, esrgan-anime, esrgan-animevideo, indextts-2.5, birefnet, da3-mono-large, lama]
port: 10020
memory_gib: 75           # LTX-2.5 + Gemma TE ~40 GB, FLUX.2 ~34 GB; ComfyUI holds one family at a time (core calls /v1/free between families)
slots: 1
load_timeout_s: 600
stop_timeout_s: 30
run: |
  --gpus all --ipc host --shm-size 16g --memory 82g --memory-swap 82g
  -p 127.0.0.1:${PORT}:8000
  -v ${models}:/models:ro
  -v ${data}/jobs:/jobs
  -e HF_HUB_OFFLINE=1
  -e 'COMFY_ARGS=--disable-pinned-memory --reserve-vram 4'
  karspark/comfyui:0.42.4-r15
